<!DOCTYPE html>
<html lang="sr-Latn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zadatak — Notebook</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="app-page task-page">
  <header class="task-topbar">
    <a href="assignments.html" class="back-link">← Nazad na zadatke</a>
    <span class="task-brand" data-cfg="siteName">Notebook</span>
  </header>
  <main class="task-main">
    <div class="task-wrap" id="task-content">
      <div class="page-head task-head">
        <div class="eyebrow" id="task-number">ZADATAK</div>
        <h1 id="task-title">Učitavanje...</h1>
        <p class="desc" id="task-description"></p>
        <span class="lesson-tag" id="task-lesson"></span>
      </div>
      <div class="submission-form task-detail-grid">
        <section class="submission-panel">
          <div class="panel-heading"><div><span class="panel-kicker">KOD</span><h2>C# rešenje</h2></div></div>
          <pre class="code-view"><code id="code-view">Učitavanje koda...</code></pre>
        </section>
        <section class="submission-panel proof-panel">
          <div class="panel-heading"><div><span class="panel-kicker">DOKAZ</span><h2>Screenshot programa</h2></div></div>
          <button class="proof-display" type="button" id="view-proof" aria-label="Prikaži veću sliku">
            <img id="proof-preview" alt="Screenshot kao dokaz rada" hidden>
            <span id="proof-empty">Dokaz za ovaj zadatak još nije dodat.</span>
          </button>
          <p class="proof-hint" id="proof-hint" hidden>Klikni na sliku za veći prikaz.</p>
        </section>
      </div>
    </div>
    <div class="task-missing" id="task-missing" hidden><h1>Zadatak nije pronađen</h1><p>Vrati se na listu i izaberi postojeći zadatak.</p><a class="btn primary" href="assignments.html">Nazad na zadatke</a></div>
  </main>
  <div class="lightbox" id="lightbox">
    <div class="lightbox-inner">
      <div class="lightbox-head"><span id="lightbox-label"></span><button class="lightbox-close" id="lightbox-close" aria-label="Zatvori">×</button></div>
      <img id="lightbox-img" src="" alt="">
    </div>
  </div>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/data-assignments.js"></script>
  <script src="assets/js/render.js"></script>
  <script src="assets/js/task-submission.js"></script>
</body>
</html>
